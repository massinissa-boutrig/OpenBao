---
# Inventaire production OpenBao HA — mono-DC sur OpenStack.
#
# Topologie :
#   - 3 nœuds OpenBao (Raft 3) répartis sur 3 Availability Zones OpenStack
#     via un ServerGroup anti-affinity (cf. RUNBOOK §Prérequis OpenStack).
#   - Frontal : Octavia (LBaaS OpenStack) en topologie ACTIVE_STANDBY,
#     provisionné par le module terraform/octavia-lb/. Plus de VMs HAProxy
#     ni de keepalived/VRRP dans cet inventaire.
#   - La Floating IP vip-bao.intra (10.10.0.100) est associée au port VIP
#     du LB Octavia (cf. terraform/octavia-lb/main.tf).
all:
  children:

    # ============================================================
    # Nœuds OpenBao — 3 voters Raft, 1 par AZ
    # ============================================================
    openbao:
      hosts:
        bao-node-1:
          ansible_host: 10.10.0.10
          openbao_az: az-1
          openbao_node_id: node-1
        bao-node-2:
          ansible_host: 10.10.0.11
          openbao_az: az-2
          openbao_node_id: node-2
        bao-node-3:
          ansible_host: 10.10.0.12
          openbao_az: az-3
          openbao_node_id: node-3
