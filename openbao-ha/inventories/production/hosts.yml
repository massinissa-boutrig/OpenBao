---
# Inventaire production OpenBao HA — mono-DC sur OpenStack.
#
# Topologie :
#   - 3 nœuds OpenBao (Raft 3) répartis sur 3 Availability Zones OpenStack
#     via un ServerGroup anti-affinity (cf. RUNBOOK §0).
#   - 2 HAProxy frontaux (master/backup) avec failover de Floating IP
#     géré par le rôle openstack_fip (script Python + systemd timer +
#     API Neutron). PAS de keepalived/VRRP.
#   - La Floating IP doit être pré-créée via openstack CLI ou Heat,
#     attachée par défaut au port Neutron de ha-1, déclarée en
#     allowed-address-pairs nulle part (la FIP n'est PAS portée par
#     l'OS, c'est Neutron qui la NAT vers le port assigné).
all:
  children:

    # ============================================================
    # Nœuds OpenBao — 3 voters Raft, 1 par AZ
    # ============================================================
    openbao:
      hosts:
        bao-node-1:
          ansible_host: 10.10.0.10
          openbao_az: az-1
          openbao_node_id: node-1
        bao-node-2:
          ansible_host: 10.10.0.11
          openbao_az: az-2
          openbao_node_id: node-2
        bao-node-3:
          ansible_host: 10.10.0.12
          openbao_az: az-3
          openbao_node_id: node-3

    # ============================================================
    # HAProxy — paire master/backup avec bascule de Floating IP via Neutron
    # Réparties sur 2 AZ pour tolérer la perte d'une AZ.
    # ============================================================
    haproxy:
      hosts:
        ha-1:
          ansible_host: 10.10.0.21
          haproxy_az: az-1
          haproxy_priority: master   # priorité nominale, prend la FIP en premier
        ha-2:
          ansible_host: 10.10.0.22
          haproxy_az: az-2
          haproxy_priority: backup   # ne prend la FIP que si master KO
      vars:
        # Floating IP unique exposée au client (NAT Neutron).
        # Doit être pré-allouée : openstack floating ip create <ext-net>
        openstack_floating_ip: 10.10.0.100
