---
# Inventaire production OpenBao HA multi-DC.
# Topologie : 3 nœuds OpenBao (1 par DC, cluster Raft 1+1+1) + 6 HAProxy (2 par DC en MASTER/BACKUP keepalived).
all:
  children:

    # ============================================================
    # Nœuds OpenBao — un par DC, voters Raft
    # ============================================================
    openbao:
      hosts:
        bao-node-1:
          ansible_host: 10.10.1.10
          openbao_dc: dc-a
          openbao_node_id: node-1
        bao-node-2:
          ansible_host: 10.10.2.10
          openbao_dc: dc-b
          openbao_node_id: node-2
        bao-node-3:
          ansible_host: 10.10.3.10
          openbao_dc: dc-c
          openbao_node_id: node-3

    # ============================================================
    # HAProxy — 2 par DC (MASTER prio 110 + BACKUP prio 100)
    # ============================================================
    haproxy:
      hosts:
        ha-a1:
          ansible_host: 10.10.1.11
          haproxy_dc: dc-a
          keepalived_role: MASTER
          keepalived_priority: 110
        ha-a2:
          ansible_host: 10.10.1.12
          haproxy_dc: dc-a
          keepalived_role: BACKUP
          keepalived_priority: 100
        ha-b1:
          ansible_host: 10.10.2.11
          haproxy_dc: dc-b
          keepalived_role: MASTER
          keepalived_priority: 110
        ha-b2:
          ansible_host: 10.10.2.12
          haproxy_dc: dc-b
          keepalived_role: BACKUP
          keepalived_priority: 100
        ha-c1:
          ansible_host: 10.10.3.11
          haproxy_dc: dc-c
          keepalived_role: MASTER
          keepalived_priority: 110
        ha-c2:
          ansible_host: 10.10.3.12
          haproxy_dc: dc-c
          keepalived_role: BACKUP
          keepalived_priority: 100

    # ============================================================
    # Groupes par DC — portent les variables VIP/VRRP
    # ============================================================
    dc_a:
      hosts:
        ha-a1:
        ha-a2:
      vars:
        keepalived_vip: 10.10.1.100
        keepalived_vip_cidr: 24
        keepalived_vrrp_id: 51
        keepalived_interface: eth0

    dc_b:
      hosts:
        ha-b1:
        ha-b2:
      vars:
        keepalived_vip: 10.10.2.100
        keepalived_vip_cidr: 24
        keepalived_vrrp_id: 52
        keepalived_interface: eth0

    dc_c:
      hosts:
        ha-c1:
        ha-c2:
      vars:
        keepalived_vip: 10.10.3.100
        keepalived_vip_cidr: 24
        keepalived_vrrp_id: 53
        keepalived_interface: eth0
