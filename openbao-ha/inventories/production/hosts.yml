---
# Inventaire production OpenBao HA — mono-DC sur OpenStack.
#
# Topologie :
#   - 3 nœuds OpenBao (Raft 3) répartis sur 3 Availability Zones OpenStack
#     via un ServerGroup anti-affinity (cf. RUNBOOK §Prérequis OpenStack).
#   - 2 HAProxy (MASTER/BACKUP) en frontend, 1 seule VIP keepalived (VRRP).
#   - La VIP doit être déclarée en allowed-address-pairs sur les ports
#     Neutron des 2 HAProxy pour autoriser son ARP gratuit.
all:
  children:

    # ============================================================
    # Nœuds OpenBao — 3 voters Raft, 1 par AZ
    # ============================================================
    openbao:
      hosts:
        bao-node-1:
          ansible_host: 10.10.0.10
          openbao_az: az-1
          openbao_node_id: node-1
        bao-node-2:
          ansible_host: 10.10.0.11
          openbao_az: az-2
          openbao_node_id: node-2
        bao-node-3:
          ansible_host: 10.10.0.12
          openbao_az: az-3
          openbao_node_id: node-3

    # ============================================================
    # HAProxy — paire MASTER/BACKUP avec VIP keepalived unique
    # Réparties sur 2 AZ pour tolérer la perte d'une AZ.
    # ============================================================
    haproxy:
      hosts:
        ha-1:
          ansible_host: 10.10.0.21
          haproxy_az: az-1
          keepalived_role: MASTER
          keepalived_priority: 110
        ha-2:
          ansible_host: 10.10.0.22
          haproxy_az: az-2
          keepalived_role: BACKUP
          keepalived_priority: 100
      vars:
        # VIP unique pour le DC, portée par keepalived (VRRP).
        # Doit être en allowed-address-pairs sur les ports Neutron de ha-1/ha-2.
        keepalived_vip: 10.10.0.100
        keepalived_vip_cidr: 24
        keepalived_vrrp_id: 51
        keepalived_interface: eth0
