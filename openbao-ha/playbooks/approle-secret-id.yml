---
# ============================================================
# Génération de secret_id AppRole avec response wrapping.
# ============================================================
#
# Pourquoi un playbook séparé ?
#   Un secret_id donne accès à OpenBao avec les policies de l'AppRole.
#   Il NE doit PAS transiter par Ansible en clair, ni être stocké côté
#   contrôleur. La technique standard est le response wrapping :
#     1. Le contrôleur demande un secret_id wrappé (X-Vault-Wrap-TTL).
#     2. OpenBao renvoie un wrap_token (jeton à usage unique, ttl court).
#     3. Le contrôleur transmet le wrap_token au consommateur (CI, app).
#     4. Le consommateur fait `bao unwrap <wrap_token>` → reçoit le
#        secret_id réel. Si le wrap_token a déjà été consommé, l'unwrap
#        échoue → preuve d'interception.
#
# Usage :
#   ansible-playbook playbooks/approle-secret-id.yml \
#     -e approle_name=ci-projet-a \
#     -e wrap_ttl=5m \
#     --ask-vault-pass
#
# Sortie :
#   /tmp/openbao-wrap-<approle>-<timestamp>.token
#   (mode 0600, à transmettre IMMÉDIATEMENT au consommateur)
#
# Sécurité :
#   - Le wrap_token est lui-même temporaire (5 min par défaut).
#   - Si l'opération est suspecte, ne pas livrer et générer un nouveau.
#   - Le fichier doit être supprimé après transmission.
# ============================================================
- name: Générer un secret_id AppRole wrappé
  hosts: openbao
  become: false
  gather_facts: true
  vars:
    wrap_ttl: 5m
  vars_files:
    - "{{ inventory_dir }}/group_vars/all/init.vault.yml"
  tasks:

    - name: Pré-requis — approle_name doit être passé en extra-vars
      ansible.builtin.assert:
        that:
          - approle_name is defined
          - approle_name | length > 0
        fail_msg: >-
          Usage : ansible-playbook playbooks/approle-secret-id.yml
          -e approle_name=<nom> [-e wrap_ttl=5m]
      run_once: true
      delegate_to: localhost

    - name: Générer le secret_id wrappé
      ansible.builtin.uri:
        url: "{{ openbao_api_url }}/v1/auth/approle/role/{{ approle_name }}/secret-id"
        method: POST
        body_format: json
        body: {}
        headers:
          X-Vault-Token: "{{ openbao_root_token }}"
          X-Vault-Wrap-TTL: "{{ wrap_ttl }}"
        validate_certs: true
        ca_path: "{{ openbao_tls_dir }}/ca.crt"
        status_code: 200
        return_content: true
      register: _openbao_wrap_response
      delegate_to: "{{ openbao_init_bootstrap_host }}"
      run_once: true
      no_log: true
      check_mode: false

    - name: Récupérer le role_id (non sensible)
      ansible.builtin.uri:
        url: "{{ openbao_api_url }}/v1/auth/approle/role/{{ approle_name }}/role-id"
        method: GET
        headers:
          X-Vault-Token: "{{ openbao_root_token }}"
        validate_certs: true
        ca_path: "{{ openbao_tls_dir }}/ca.crt"
        status_code: 200
        return_content: true
      register: _openbao_role_id
      delegate_to: "{{ openbao_init_bootstrap_host }}"
      run_once: true
      no_log: true
      check_mode: false
      changed_when: false

    - name: Écrire le wrap_token côté contrôleur (mode 0600)
      ansible.builtin.copy:
        content: |
          # Wrap token pour AppRole {{ approle_name }}
          # Généré : {{ ansible_date_time.iso8601 }}
          # TTL : {{ wrap_ttl }}
          # ⚠️ À TRANSMETTRE IMMÉDIATEMENT AU CONSOMMATEUR ET SUPPRIMER ENSUITE.
          #
          # Côté consommateur :
          #   export VAULT_ADDR=https://vip-bao.intra:8200
          #   export VAULT_CACERT=/etc/ssl/certs/openbao-ca.crt
          #   bao unwrap {{ _openbao_wrap_response.json.wrap_info.token }}
          # → renvoie le secret_id (à utiliser pour login).
          #
          # Login complet (après unwrap) :
          #   bao write auth/approle/login \
          #     role_id={{ _openbao_role_id.json.data.role_id }} \
          #     secret_id=<secret_id_du_unwrap>
          #
          # Variables :
          APPROLE_NAME={{ approle_name }}
          ROLE_ID={{ _openbao_role_id.json.data.role_id }}
          WRAP_TOKEN={{ _openbao_wrap_response.json.wrap_info.token }}
          WRAP_TTL={{ _openbao_wrap_response.json.wrap_info.ttl }}
          WRAP_EXPIRES={{ _openbao_wrap_response.json.wrap_info.creation_time }}
        dest: "/tmp/openbao-wrap-{{ approle_name }}-{{ ansible_date_time.epoch }}.token"
        mode: "0600"
      delegate_to: localhost
      run_once: true
      no_log: true

    - name: Résumé (sans secrets)
      ansible.builtin.debug:
        msg:
          - "✅ Secret_id wrappé pour AppRole {{ approle_name }}"
          - "Fichier : /tmp/openbao-wrap-{{ approle_name }}-{{ ansible_date_time.epoch }}.token"
          - "Role_id : {{ _openbao_role_id.json.data.role_id }}"
          - "TTL wrap : {{ _openbao_wrap_response.json.wrap_info.ttl }}s"
          - "⚠️ Transmettre le fichier au consommateur ET le supprimer ensuite."
      run_once: true
      delegate_to: localhost
