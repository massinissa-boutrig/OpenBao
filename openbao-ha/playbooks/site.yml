---
# ============================================================
# Orchestration complète : déploie OpenBao + HAProxy + Floating IP failover
# (architecture sans keepalived/VRRP, basée sur Floating IP OpenStack)
# ============================================================
- name: Déployer les nœuds OpenBao
  hosts: openbao
  become: true
  gather_facts: true
  roles:
    - openbao

- name: Déployer HAProxy
  hosts: haproxy
  become: true
  gather_facts: true
  roles:
    - haproxy

- name: Déployer le failover Floating IP (script + systemd timer)
  hosts: haproxy
  become: true
  gather_facts: true
  roles:
    - openstack_fip
