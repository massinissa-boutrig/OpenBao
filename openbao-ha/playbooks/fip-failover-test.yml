---
# Test manuel de bascule de Floating IP — coupe HAProxy master, vérifie
# que la FIP migre, redémarre HAProxy, vérifie le retour si preempt.
# À jouer en fenêtre de maintenance uniquement (~30s d'indisponibilité).
- name: Test de bascule Floating IP — état initial
  hosts: haproxy[0]
  become: true
  gather_facts: false
  tasks:
    - name: État initial — où est la FIP ?
      ansible.builtin.command:
        cmd: >-
          /usr/bin/openstack --os-cloud openbao_fip
          floating ip show {{ openstack_floating_ip_id }} -f json
      register: fip_initial
      environment:
        OS_CLIENT_CONFIG_FILE: "{{ fip_clouds_yaml | default('/etc/openstack/clouds.yaml') }}"
      changed_when: false
    - name: Afficher port_id initial
      ansible.builtin.debug:
        msg: "FIP {{ openstack_floating_ip }} sur port {{ (fip_initial.stdout | from_json).port_id }}"

- name: Test de bascule Floating IP — kill master
  hosts: haproxy
  become: true
  gather_facts: false
  tasks:
    - name: Stopper HAProxy sur le master
      ansible.builtin.systemd:
        name: haproxy
        state: stopped
      when: haproxy_priority == 'master'
    - name: Attendre la détection KO + bascule
      ansible.builtin.pause:
        seconds: "{{ (fip_health_consecutive_ko | default(3)) * (fip_timer_period_sec | default(10)) + 5 }}"
      when: haproxy_priority == 'master'

- name: Test de bascule Floating IP — vérifier migration
  hosts: haproxy[0]
  become: true
  gather_facts: false
  tasks:
    - name: État après panne
      ansible.builtin.command:
        cmd: >-
          /usr/bin/openstack --os-cloud openbao_fip
          floating ip show {{ openstack_floating_ip_id }} -f json
      register: fip_after_kill
      environment:
        OS_CLIENT_CONFIG_FILE: "{{ fip_clouds_yaml | default('/etc/openstack/clouds.yaml') }}"
      changed_when: false
    - name: Vérifier que le port_id a changé
      ansible.builtin.assert:
        that:
          - (fip_after_kill.stdout | from_json).port_id != (fip_initial.stdout | from_json).port_id
        fail_msg: "ÉCHEC : la FIP n'a pas migré"
        success_msg: "OK : FIP migrée"

- name: Test de bascule Floating IP — restaurer master
  hosts: haproxy
  become: true
  gather_facts: false
  tasks:
    - name: Redémarrer HAProxy sur le master
      ansible.builtin.systemd:
        name: haproxy
        state: started
      when: haproxy_priority == 'master'
    - name: Attendre la stabilisation
      ansible.builtin.pause:
        seconds: "{{ (fip_health_consecutive_ok | default(2)) * (fip_timer_period_sec | default(10)) + 5 }}"
      run_once: true
