---
- name: Check installed OpenBao version (if any)
  ansible.builtin.command: "{{ openbao_binary_path }} version"
  register: openbao_installed_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Set fact whether install/upgrade is needed
  ansible.builtin.set_fact:
    openbao_install_needed: >-
      {{ openbao_installed_version.rc != 0
         or openbao_version not in (openbao_installed_version.stdout | default('')) }}

- name: Download OpenBao .deb (with SHA256 verification)
  ansible.builtin.get_url:
    url: "{{ openbao_deb_url }}"
    dest: "/tmp/bao_{{ openbao_version }}_linux_{{ openbao_arch }}.deb"
    checksum: "sha256:{{ openbao_checksum_sha256 }}"
    mode: "0644"
    timeout: 60
  when: openbao_install_needed

- name: Install OpenBao .deb package
  ansible.builtin.apt:
    deb: "/tmp/bao_{{ openbao_version }}_linux_{{ openbao_arch }}.deb"
    state: present
  when: openbao_install_needed
  notify: restart openbao

- name: Apply CAP_IPC_LOCK capability on bao binary (mlock without root)
  community.general.capabilities:
    path: "{{ openbao_binary_path }}"
    capability: cap_ipc_lock=+ep
    state: present

- name: Cleanup downloaded .deb
  ansible.builtin.file:
    path: "/tmp/bao_{{ openbao_version }}_linux_{{ openbao_arch }}.deb"
    state: absent

- name: Mask packaged openbao service (we deploy our own hardened unit)
  ansible.builtin.systemd:
    name: openbao
    enabled: false
    masked: false
  failed_when: false
  changed_when: false
