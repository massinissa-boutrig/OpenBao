---
# ============================================================
# Déploiement déclaratif des policies OpenBao.
# ============================================================
# Policies déployées :
#   - admin                       (statique)
#   - auditor                     (statique)
#   - secrets-rw-<projet>         (une par projet déclaré)
#   - secrets-ro-<projet>         (une par projet déclaré)
#
# Idempotence :
#   On rend le HCL en mémoire, on PUT via /v1/sys/policies/acl/<name>.
#   OpenBao remplace le contenu : le PUT est intrinsèquement idempotent.
#
# Sécurité :
#   - Le root token n'est passé qu'en header X-Vault-Token (jamais en URL ni body).
#   - no_log sur les calls qui transmettent le token.
# ============================================================

- name: Policies — rendre admin.hcl
  ansible.builtin.set_fact:
    _openbao_policy_admin: "{{ lookup('template', 'policies/admin.hcl.j2') }}"
  no_log: true

- name: Policies — rendre auditor.hcl
  ansible.builtin.set_fact:
    _openbao_policy_auditor: "{{ lookup('template', 'policies/auditor.hcl.j2') }}"
  no_log: true

- name: Policies — déployer admin
  ansible.builtin.uri:
    url: "{{ openbao_api_url }}/v1/sys/policies/acl/admin"
    method: PUT
    body_format: json
    body:
      policy: "{{ _openbao_policy_admin }}"
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
    validate_certs: true
    ca_path: "{{ openbao_tls_dir }}/ca.crt"
    status_code: [200, 204]
  no_log: true
  check_mode: false
  changed_when: true

- name: Policies — déployer auditor
  ansible.builtin.uri:
    url: "{{ openbao_api_url }}/v1/sys/policies/acl/auditor"
    method: PUT
    body_format: json
    body:
      policy: "{{ _openbao_policy_auditor }}"
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
    validate_certs: true
    ca_path: "{{ openbao_tls_dir }}/ca.crt"
    status_code: [200, 204]
  no_log: true
  check_mode: false
  changed_when: true

- name: Policies — déployer secrets-rw-<projet> et secrets-ro-<projet> pour chaque projet
  ansible.builtin.uri:
    url: "{{ openbao_api_url }}/v1/sys/policies/acl/{{ item.1 }}-{{ item.0.name }}"
    method: PUT
    body_format: json
    body:
      policy: "{{ lookup('template', 'policies/' + item.1 + '.hcl.j2') }}"
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
    validate_certs: true
    ca_path: "{{ openbao_tls_dir }}/ca.crt"
    status_code: [200, 204]
  vars:
    projet: "{{ item.0.name }}"
  loop: "{{ openbao_projects | product(['secrets-rw', 'secrets-ro']) | list }}"
  loop_control:
    label: "{{ item.1 }}-{{ item.0.name }}"
  no_log: true
  check_mode: false
  changed_when: true
