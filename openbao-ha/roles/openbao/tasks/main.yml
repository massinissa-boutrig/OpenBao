---
# Orchestration du rôle openbao — chaque sous-tâche porte ses propres tags.
- name: Preflight checks
  ansible.builtin.import_tasks: preflight.yml
  tags: [openbao, preflight]

- name: Install OS packages
  ansible.builtin.import_tasks: packages.yml
  tags: [openbao, packages]

- name: Create dedicated user/group and directories
  ansible.builtin.import_tasks: user.yml
  tags: [openbao, user]

- name: Install OpenBao binary
  ansible.builtin.import_tasks: install.yml
  tags: [openbao, install]

- name: Deploy TLS material (CA + host cert/key)
  ansible.builtin.import_tasks: tls.yml
  tags: [openbao, tls]

- name: Deploy configuration
  ansible.builtin.import_tasks: config.yml
  tags: [openbao, config]

- name: Deploy systemd unit
  ansible.builtin.import_tasks: systemd.yml
  tags: [openbao, systemd]

- name: Configure nftables firewall
  ansible.builtin.import_tasks: firewall.yml
  tags: [openbao, firewall]

- name: Configure logrotate
  ansible.builtin.import_tasks: logrotate.yml
  tags: [openbao, logrotate]

- name: Enable and start service
  ansible.builtin.import_tasks: service.yml
  tags: [openbao, service]

- name: Auto-init du cluster (idempotent — voir openbao_auto_init_enabled)
  ansible.builtin.import_tasks: init.yml
  tags: [openbao, init]
  when: openbao_auto_init_enabled | default(false) | bool

- name: Auto-unseal (clés Shamir depuis Ansible Vault ou facts post-init)
  ansible.builtin.import_tasks: unseal.yml
  tags: [openbao, unseal]
  when: >-
    (openbao_auto_unseal_enabled | default(false) | bool)
    or (openbao_init_just_done | default(false) | bool)

- name: Configure auth methods, secret engines, policies, identités
  ansible.builtin.import_tasks: configure.yml
  tags: [openbao, configure]
  when: openbao_auto_configure_enabled | default(false) | bool
  delegate_to: "{{ openbao_init_bootstrap_host }}"
  run_once: true

- name: Forward rsyslog vers SIEM (audit + sshd)
  ansible.builtin.import_tasks: syslog_forward.yml
  tags: [openbao, syslog, siem]
  when: openbao_siem_enabled | default(false) | bool
