---
# ============================================================
# Activation des secret engines : un mount KV v2 par projet.
# ============================================================
# Convention de nommage : kv-<projet>/
#   - Isolation par mount → policies projet ciblent kv-<projet>/data/*
#   - Versioning natif KV v2 (historique, rollback, undelete)
#
# Idempotence :
#   1. GET /v1/sys/mounts pour connaître l'existant.
#   2. Si absent : POST /v1/sys/mounts/kv-<projet> (enable).
#   3. Si présent : POST /v1/sys/mounts/kv-<projet>/tune
#      pour aligner description / default_lease_ttl.
# ============================================================

- name: Secret engines — récupérer l'état actuel des mounts
  ansible.builtin.uri:
    url: "{{ openbao_api_url }}/v1/sys/mounts"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
    validate_certs: true
    ca_path: "{{ openbao_tls_dir }}/ca.crt"
    status_code: 200
    return_content: true
  register: _openbao_mounts_state
  no_log: true
  check_mode: false
  changed_when: false

- name: Secret engines — créer un mount KV v2 par projet (si absent)
  ansible.builtin.uri:
    url: "{{ openbao_api_url }}/v1/sys/mounts/kv-{{ item.name }}"
    method: POST
    body_format: json
    body:
      type: kv
      description: "KV v2 pour le projet {{ item.name }}"
      options:
        version: "2"
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
    validate_certs: true
    ca_path: "{{ openbao_tls_dir }}/ca.crt"
    status_code: [200, 204]
  loop: "{{ openbao_projects }}"
  loop_control:
    label: "kv-{{ item.name }}"
  when: ('kv-' + item.name + '/') not in (_openbao_mounts_state.json | default({}))
  no_log: true
  check_mode: false
  changed_when: true

- name: Secret engines — tuner les mounts existants (description)
  ansible.builtin.uri:
    url: "{{ openbao_api_url }}/v1/sys/mounts/kv-{{ item.name }}/tune"
    method: POST
    body_format: json
    body:
      description: "KV v2 pour le projet {{ item.name }}"
    headers:
      X-Vault-Token: "{{ openbao_root_token }}"
    validate_certs: true
    ca_path: "{{ openbao_tls_dir }}/ca.crt"
    status_code: [200, 204]
  loop: "{{ openbao_projects }}"
  loop_control:
    label: "kv-{{ item.name }}"
  when: ('kv-' + item.name + '/') in (_openbao_mounts_state.json | default({}))
  no_log: true
  check_mode: false
  changed_when: true
