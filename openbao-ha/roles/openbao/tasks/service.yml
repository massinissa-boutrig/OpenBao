---
- name: Flush handlers before starting service
  ansible.builtin.meta: flush_handlers

- name: Enable and start openbao service
  ansible.builtin.systemd:
    name: openbao
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for OpenBao API port to be open
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ openbao_api_port }}"
    timeout: 30
    state: started

- name: Get OpenBao status (soft-fail — normal if not initialized yet)
  ansible.builtin.command: "{{ openbao_binary_path }} status -format=json"
  environment:
    BAO_ADDR: "https://127.0.0.1:{{ openbao_api_port }}"
    BAO_CACERT: "{{ openbao_tls_dir }}/ca.crt"
  register: bao_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Display OpenBao status summary
  ansible.builtin.debug:
    msg: >-
      Node {{ inventory_hostname }} :
      {{ (bao_status.stdout | from_json).initialized | default('unknown') }} initialized,
      {{ (bao_status.stdout | from_json).sealed | default('unknown') }} sealed
  when: bao_status.stdout | length > 0 and bao_status.stdout is search('^\\{')
