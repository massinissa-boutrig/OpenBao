---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart openbao
  # ⚠️ Un restart met le nœud en SEALED — re-unseal manuel requis (3 opérateurs).
  ansible.builtin.systemd:
    name: openbao
    state: restarted

- name: update ca trust
  ansible.builtin.command: /usr/sbin/update-ca-certificates
  changed_when: true

- name: reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: reloaded
