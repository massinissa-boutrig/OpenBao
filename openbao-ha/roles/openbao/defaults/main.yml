---
# ============================================================
# Defaults rôle openbao — surcharger via group_vars/openbao.yml
# ============================================================

# Bind du listener et des adresses (annoncées aux pairs Raft / aux clients).
openbao_listener_address: "0.0.0.0"

# Désactiver mlock = false → mlock activé (recommandé en prod, secrets non swappés).
openbao_disable_mlock: false

# UI Web embarquée.
openbao_ui_enabled: true

# Logs.
openbao_log_level: info
openbao_log_format: json

# Cluster.
openbao_cluster_name: openbao-prod

# Tuning Raft.
openbao_raft_performance_multiplier: 1
openbao_raft_snapshot_threshold: 8192
openbao_raft_trailing_logs: 10000

# Audit log (créé après init via runbook, on ne fait que pré-créer le chemin).
openbao_audit_log_path: "{{ openbao_log_dir }}/audit.log"

# Telemetry Prometheus.
openbao_telemetry_prometheus_enabled: true
openbao_telemetry_disable_hostname: true

# Limites systemd.
openbao_limit_memlock: infinity
openbao_limit_nofile: 65536
openbao_limit_core: 0

# Soft-fail : afficher l'erreur de `bao operator diagnose` sans casser le play
# (utile au tout premier déploiement avant init).
openbao_diagnose_soft_fail: true

# ============================================================
# Auto-init du cluster (zéro intervention humaine à l'install)
# ============================================================
# Activer pour qu'Ansible exécute lui-même `sys/init` la première fois
# (POST /v1/sys/init avec Shamir 5/3 par défaut), persiste les keys + le
# root token chiffrés dans openbao_init_vault_path côté contrôleur, puis
# unseal automatiquement les 3 nœuds. Idempotent : si le cluster est
# déjà initialisé, la tâche est skip silencieusement.
openbao_auto_init_enabled: false

# Nœud bootstrap : celui qui reçoit POST /v1/sys/init.
# Doit être un membre du groupe `openbao`.
openbao_init_bootstrap_host: bao-node-1

# Schéma Shamir.
openbao_init_key_shares: 5
openbao_init_key_threshold: 3

# Délai max d'attente du listener TCP avant init (secondes).
openbao_init_listener_timeout: 60

# Chemin local (côté contrôleur) du fichier Ansible Vault qui recevra
# les unseal_keys + root_token. Doit être en dehors de tout dépôt git
# en plain (le fichier est chiffré, mais autant éviter le risque).
# Par défaut : à côté du vault.yml existant pour cohérence.
openbao_init_vault_path: "{{ inventory_dir }}/group_vars/all/init.vault.yml"

# Fichier contenant la passphrase ansible-vault (le même que pour le
# reste du projet). Renseigner dans ansible.cfg (vault_password_file)
# ou le surcharger ici.
openbao_init_vault_password_file: "{{ lookup('env', 'ANSIBLE_VAULT_PASSWORD_FILE') | default('~/.ansible/vault_pass', true) }}"

# ============================================================
# Configure (déclaratif) — auth methods + secret engines + policies
# ============================================================
# Activer pour qu'Ansible configure lui-même userpass + AppRole + KV v2
# + policies (admin, auditor, secrets-rw/ro par projet) + utilisateurs.
# Dépend de openbao_root_token (lu depuis init.vault.yml ou vault.yml).
# Idempotent : skip silencieux si tout est déjà aligné.
openbao_auto_configure_enabled: false

# URL de l'API utilisée pour les appels de configuration (depuis le
# nœud bootstrap, en local — TLS validé via openbao_tls_dir/ca.crt).
openbao_api_url: "https://127.0.0.1:{{ openbao_api_port | default(8200) }}"

# Méthodes d'authentification à activer (path = mount path).
# Le 'type' ne peut PAS changer après création : pour migrer un type,
# disable+enable manuellement avant de relancer le rôle.
openbao_auth_methods:
  - type: userpass
    path: userpass
    description: "Authentification utilisateurs humains (avec MFA)"
    config:
      default_lease_ttl: "1h"
      max_lease_ttl: "8h"
  - type: approle
    path: approle
    description: "Authentification machines (CI/CD, workloads)"
    config:
      default_lease_ttl: "1h"
      max_lease_ttl: "24h"

# Liste des projets — un mount KV v2 + 2 policies (rw, ro) par projet.
# Surchargé dans group_vars/all/main.yml selon les projets réels.
openbao_projects: []

# Utilisateurs userpass à créer/maintenir (déclaratif).
# Le mot de passe est lu depuis vault.yml via la variable nommée
# dans password_var (pour ne pas mélanger liste publique et secret).
openbao_userpass_users: []

# AppRoles à créer/maintenir (déclaratif).
# Note : la génération de secret_id n'est PAS faite ici — voir
# playbooks/approle-secret-id.yml qui utilise le response wrapping
# pour distribution one-shot sécurisée.
openbao_approles: []

# Audit devices (par défaut : file + syslog pour éviter le SPOF).
# Le file est rotaté par logrotate (cf. tasks/logrotate.yml).
# Le syslog peut être forwardé vers un SIEM externe (rsyslog → SIEM).
# MFA TOTP (login enforcement) — opt-in.
# Activer pour exiger un code TOTP en plus du userpass à chaque login.
# Une fois activé, les utilisateurs DOIVENT s'enrôler via la procédure
# RUNBOOK §1bis.8 sinon ils ne pourront plus se connecter.
openbao_mfa_enabled: false

# Méthodes TOTP à créer.
openbao_mfa_methods:
  - method_name: totp-default
    issuer: OpenBao
    period: 30
    key_size: 20
    algorithm: SHA256
    digits: 6
    skew: 1
    max_validation_attempts: 5

# Login enforcements : qui doit fournir un TOTP, sur quelle auth method.
# Par défaut : tous les logins userpass demandent un TOTP.
openbao_mfa_enforcements:
  - name: userpass-totp-required
    mfa_method_names: [totp-default]
    auth_method_types: [userpass]

openbao_audit_devices:
  - path: file
    type: file
    description: "Audit log fichier (rotaté par logrotate)"
    options:
      file_path: "{{ openbao_audit_log_path | default('/var/log/openbao/audit.log') }}"
      log_raw: "false"
      hmac_accessor: "true"
      mode: "0600"
      format: "json"
  - path: syslog
    type: syslog
    description: "Audit log syslog (forward SIEM)"
    options:
      facility: "AUTH"
      tag: "openbao"
      log_raw: "false"
      hmac_accessor: "true"
      format: "json"
