---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [haproxy, packages]

- name: Install HAProxy and dependencies
  ansible.builtin.apt:
    name:
      - haproxy
      - nftables
      - ca-certificates
      - logrotate
    state: present
  tags: [haproxy, packages]

- name: Create HAProxy log directory
  ansible.builtin.file:
    path: "{{ haproxy_log_dir }}"
    state: directory
    owner: haproxy
    group: haproxy
    mode: "0750"
  tags: [haproxy, install]

- name: Check that internal CA is present on controller
  ansible.builtin.stat:
    path: "{{ pki_dir }}/ca.crt"
  delegate_to: localhost
  become: false
  register: ca_stat
  tags: [haproxy, tls]

- name: Fail if CA is missing
  ansible.builtin.fail:
    msg: "ca.crt manquant dans {{ pki_dir }} — lancer playbooks/pki.yml d'abord."
  when: not ca_stat.stat.exists
  tags: [haproxy, tls]

- name: Copy internal CA for healthcheck verification
  ansible.builtin.copy:
    src: "{{ pki_dir }}/ca.crt"
    dest: "{{ haproxy_ca_path }}"
    owner: haproxy
    group: haproxy
    mode: "0644"
  notify: reload haproxy
  tags: [haproxy, tls]

- name: Deploy haproxy.cfg (validated via haproxy -c -f)
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: haproxy
    mode: "0640"
    validate: "haproxy -c -f %s"
  notify: reload haproxy
  tags: [haproxy, config]

- name: Deploy nftables ruleset for HAProxy
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0640"
    validate: "nft -c -f %s"
  notify: reload nftables
  tags: [haproxy, firewall]

- name: Ensure nftables is enabled and started
  ansible.builtin.systemd:
    name: nftables
    state: started
    enabled: true
  tags: [haproxy, firewall]

- name: Deploy logrotate config for HAProxy
  ansible.builtin.copy:
    dest: /etc/logrotate.d/haproxy-openbao
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ haproxy_log_dir }}/*.log {
          daily
          rotate 30
          compress
          delaycompress
          missingok
          notifempty
          create 0640 haproxy haproxy
          postrotate
              systemctl reload haproxy 2>/dev/null || true
          endscript
      }
  tags: [haproxy, logrotate]

- name: Enable and start HAProxy
  ansible.builtin.systemd:
    name: haproxy
    state: started
    enabled: true
  tags: [haproxy, service]
