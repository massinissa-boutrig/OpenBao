---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [keepalived, packages]

- name: Install keepalived and helpers
  ansible.builtin.apt:
    name:
      - keepalived
      - psmisc
    state: present
  tags: [keepalived, packages]

- name: Deploy HAProxy check script
  ansible.builtin.template:
    src: check_haproxy.sh.j2
    dest: "{{ keepalived_check_script_path }}"
    owner: root
    group: root
    mode: "0755"
  tags: [keepalived, config]

- name: Deploy keepalived.conf
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0640"
  notify: restart keepalived
  tags: [keepalived, config]

# NB : l'autorisation VRRP (proto 112) est posée dans la table nftables
# du rôle haproxy, qui partage le même hôte. Pas besoin de double règle ici.

- name: Enable IP non-local bind (allows binding the VIP before it exists)
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  tags: [keepalived, sysctl]

- name: Enable and start keepalived
  ansible.builtin.systemd:
    name: keepalived
    state: started
    enabled: true
  tags: [keepalived, service]
