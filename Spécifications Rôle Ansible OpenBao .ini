Pour démarrer ce projet dans Claude Cowork ou un environnement similaire, le prompt à donner à l'agent est :

> "Lis le fichier `SPECIFICATIONS-openbao-ha.md` fourni. Produis l'intégralité du projet décrit, en respectant scrupuleusement la section 3 (décisions d'architecture imposées) et la section 6 (exigences de qualité). Suis l'ordre de production de la section 9. À chaque étape importante, affiche l'arborescence produite et attends validation avant de continuer. À la fin, livre une archive tar.gz du projet complet."