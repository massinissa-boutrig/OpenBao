# Spécifications — Rôle Ansible OpenBao HA multi-DC

> Document de spécifications destiné à être fourni à un agent Claude (Cowork, Claude Code, etc.) pour reproduire intégralement le projet de déploiement OpenBao en haute disponibilité.

## 1. Contexte et objectif

Créer un projet Ansible production-grade pour déployer **OpenBao** (fork open-source de HashiCorp Vault) en haute disponibilité sur une infrastructure d'entreprise. Le projet doit inclure les rôles Ansible, les playbooks d'orchestration, la documentation d'exploitation et un schéma d'architecture.

**Livrable final** : une arborescence de projet complète, prête à être committée dans un repo Git et déployée sur une infrastructure réelle.

## 2. Contraintes d'infrastructure

| Élément | Valeur |
|---|---|
| OS cible | RHEL 9 (compatible Rocky 9 / AlmaLinux 9) |
| Hyperviseur | Proxmox VE (VMs) |
| Topologie | Multi-datacenter, 3 DCs |
| Mode HA | Actif/actif côté HAProxy (1 VIP par DC), cluster OpenBao unique partagé |
| Nombre de nœuds OpenBao | 3 (un par DC, configuration 1+1+1 pour quorum Raft résilient) |
| Nombre de HAProxy | 6 (2 par DC en actif/passif avec keepalived) |
| Réseau | DNS interne, firewalld activé, SELinux enforcing |

## 3. Décisions d'architecture (toutes imposées, ne pas les remettre en cause)

### 3.1 Storage backend

**Raft Integrated Storage** uniquement. Pas de backend externe (pas de PostgreSQL, pas de Consul). Justification : pas de SPOF externe, réplication native, snapshots intégrés, c'est le standard recommandé par HashiCorp/OpenBao.

### 3.2 Seal / Unseal

**Shamir manuel, 5 parts, seuil de 3**. Pas d'auto-unseal via Transit/KMS/HSM. Justification : éviter d'ajouter une dépendance externe qui devient elle-même critique. L'unseal après reboot est documenté dans un runbook.

### 3.3 TLS

PKI interne avec CA dédiée, générée par un playbook Ansible dédié (`playbooks/pki.yml`) via `community.crypto`. mTLS entre nœuds Raft sur le port cluster (8201). TLS 1.3 minimum, ciphers restreints aux recommandations modernes (`TLS_AES_256_GCM_SHA384`, `TLS_CHACHA20_POLY1305_SHA256`, `TLS_AES_128_GCM_SHA256`).

### 3.4 HAProxy

**Mode TCP passthrough** (pas de terminaison TLS sur HAProxy). Justification : OpenBao garde la terminaison TLS de bout en bout, pas de déchiffrement intermédiaire.

Load-balancing **roundrobin** sur les 3 nœuds OpenBao. Pas de stickiness : OpenBao forward les requêtes d'un standby vers le leader en interne.

Health check HTTP via `option httpchk` sur `GET /v1/sys/health?standbyok=true&perfstandbyok=true` avec `check-ssl` et CA interne :
- Accepter les codes **200** (leader actif) et **429** (standby unsealed)
- Rejeter 501 (non initialisé), 503 (sealed), 472, 473

### 3.5 Keepalived

Une VIP flottante par DC, VRRP ID différent par DC (51, 52, 53). Un MASTER (priorité 110) et un BACKUP (priorité 100) par DC. Pas d'anycast/BGP.

### 3.6 Hardening systemd OpenBao

L'unit systemd doit inclure :
- `Type=notify`
- Utilisateur dédié `openbao` (system, nologin)
- Capability `CAP_IPC_LOCK` uniquement (pour mlock sans root)
- `ProtectSystem=strict`, `ProtectHome=true`, `PrivateTmp=true`, `PrivateDevices=true`
- `ProtectKernelTunables=true`, `ProtectKernelModules=true`, `ProtectKernelLogs=true`
- `ProtectControlGroups=true`, `ProtectHostname=true`, `ProtectClock=true`
- `ProtectProc=invisible`, `ProcSubset=pid`
- `NoNewPrivileges=true`, `RestrictNamespaces=true`, `RestrictRealtime=true`, `RestrictSUIDSGID=true`
- `LockPersonality=true`, `MemoryDenyWriteExecute=true`
- `SystemCallArchitectures=native`, `SystemCallFilter=@system-service`, `SystemCallFilter=~@privileged @resources @mount @swap @reboot @debug`
- `ReadWritePaths` limité à data_dir et log_dir
- `LimitMEMLOCK=infinity`, `LimitNOFILE=65536`, `LimitCORE=0`

### 3.7 Ports et firewalld

| Port | Usage | Règle firewalld |
|---|---|---|
| 8200/tcp | API OpenBao (TLS) | Ouvert en zone public |
| 8201/tcp | Cluster Raft (mTLS) | Restreint par rich rules aux IPs des pairs Raft uniquement |
| 8200/tcp (HAProxy) | VIP frontend | Ouvert en zone public |
| 8404/tcp | HAProxy stats | Restreint aux IPs de supervision |

