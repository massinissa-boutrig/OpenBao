## 6. Exigences de qualité

1. **Idempotence** : toutes les tâches doivent être idempotentes. Un deuxième `ansible-playbook site.yml` ne doit rien changer.
2. **Handlers** : tous les changements de config doivent notifier les handlers appropriés (reload/restart). Attention : un `restart openbao` met le nœud en sealed, il faut le documenter.
3. **Tags** : chaque bloc de tâches porte un tag (ex: `openbao`, `config`, `tls`) pour pouvoir exécuter partiellement.
4. **`no_log: true`** sur les tâches manipulant des secrets (clés privées).
5. **Validation** : utiliser `validate:` sur les templates critiques (`haproxy -c -f %s`, `bao operator diagnose`).
6. **Comments YAML** : toutes les variables non triviales doivent être commentées dans les defaults.
7. **Ansible managed** : tous les templates commencent par `{{ ansible_managed | comment }}`.
8. **Pas de credentials en clair** : tout secret passe par Ansible Vault, les exemples utilisent `CHANGEME_...`.
9. **Conventions Ansible Galaxy** : respecter la structure standard, `meta/main.yml` renseigné.

## 7. Versions et releases

- OpenBao : dernière stable au moment du déploiement (variable `openbao_version`, checksum SHA256 à récupérer depuis les GitHub releases officielles : https://github.com/openbao/openbao/releases).
- Ansible : 2.14 minimum.
- HAProxy : version du dépôt RHEL 9 (2.4+).
- Keepalived : version du dépôt RHEL 9.

## 8. Critères d'acceptation

Le projet est considéré comme terminé quand :

1. `ansible-playbook --syntax-check playbooks/site.yml` passe sans erreur.
2. `ansible-lint roles/ playbooks/` ne remonte aucune erreur (warnings tolérés si justifiés).
3. `yamllint .` passe (config relaxed acceptable sur la longueur de ligne).
4. Le README permet à un ingénieur qui découvre le projet de le déployer sans aide extérieure.
5. Le runbook couvre tous les scénarios listés en 5.12.
6. Les 27+ fichiers attendus sont présents dans l'arborescence.
7. Le schéma draw.io s'ouvre correctement dans l'éditeur.

## 9. Ordre de production recommandé

Pour l'agent qui reprend le travail, voici l'ordre suggéré pour minimiser les erreurs :

1. Créer l'arborescence vide.
2. `README.md`, `ansible.cfg`, `requirements.yml`.
3. Inventaire + group_vars.
4. Rôle `openbao` complet (le plus gros).
5. Rôle `haproxy`.
6. Rôle `keepalived`.
7. `playbooks/pki.yml`.
8. `playbooks/site.yml` et `playbooks/backup.yml`.
9. `docs/RUNBOOK.md`.
10. `docs/architecture.drawio`.
11. Relecture croisée, vérification de la cohérence des variables (notamment `ansible_host` vs `inventory_hostname` dans les certs et les config).

## 10. Pièges à éviter

- **Ne pas mettre de bloc `seal` dans `config.hcl`** : Shamir est implicite.
- **`cluster_addr` doit utiliser l'IP réelle**, pas `0.0.0.0`, pour que les autres nœuds puissent s'y connecter.
- **`retry_join` pointe vers tous les nœuds du cluster, y compris soi-même** : OpenBao gère le cas.
- **Le SAN des certificats doit inclure l'IP ET le FQDN** utilisés dans `api_addr` / `cluster_addr` / HAProxy SNI.
- **SELinux** : sans `seboolean haproxy_connect_any`, HAProxy ne peut pas se connecter aux backends.
- **mlock + systemd** : sans `CAP_IPC_LOCK` en `AmbientCapabilities`, le service échoue au démarrage si `disable_mlock = false`.
- **VRRP multicast** : firewalld bloque par défaut, il faut une rich rule `protocol value="112"` entre les HAProxy d'un même DC.
- **Ansible Vault** : NE PAS y stocker les unseal keys Shamir — elles doivent être distribuées à des humains.
- **Un restart de service sur un OpenBao unsealed le re-seal** : documenter pour les opérateurs.

