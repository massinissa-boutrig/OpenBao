## 5. Contenu détaillé attendu

### 5.1 `ansible.cfg`

Doit contenir : inventaire par défaut pointant vers `inventories/production/hosts.yml`, `roles_path = roles`, `host_key_checking = True`, `forks = 10`, `gathering = smart`, fact caching jsonfile dans `.ansible_cache`, pipelining SSH activé, ControlMaster auto, `become = True` / `become_method = sudo`.

### 5.2 `requirements.yml`

Collections : `community.general >= 7.0.0`, `ansible.posix >= 1.5.0`, `community.crypto >= 2.15.0`.

### 5.3 `inventories/production/hosts.yml`

Un inventaire YAML d'exemple avec :
- Groupe `openbao` : 3 hosts (`bao-node-1`, `bao-node-2`, `bao-node-3`) avec variables `openbao_dc` (dc-a/b/c), `openbao_node_id` (node-1/2/3), `ansible_host` (IP).
- Groupe `haproxy` : 6 hosts (2 par DC), avec variables `keepalived_role` (MASTER/BACKUP), `keepalived_priority` (110/100), `haproxy_dc`.
- Groupes par DC (`dc_a`, `dc_b`, `dc_c`) contenant les 2 HAProxy du DC, avec variables de groupe : `keepalived_vip`, `keepalived_vrrp_id` (51/52/53), `keepalived_interface`.

### 5.4 `inventories/production/group_vars/all/main.yml`

Variables globales : organisation PKI (pays, nom, CN CA), domaine interne, ports (`openbao_api_port: 8200`, `openbao_cluster_port: 8201`), mapping DNS VIP par DC, version OpenBao, checksum SHA256 du binaire (à renseigner par l'utilisateur), utilisateur système `openbao`, chemins (`/etc/openbao`, `/var/lib/openbao`, `/var/log/openbao`, `/etc/openbao/tls`), `openbao_key_shares: 5`, `openbao_key_threshold: 3`, TLS 1.3 + ciphers.

### 5.5 `inventories/production/group_vars/all/vault.yml.example`

Fichier d'exemple (non chiffré, juste structure) expliquant ce qu'il faut mettre dans un Ansible Vault : passphrase de la CA, mot de passe stats HAProxy. **Important** : mentionner que les clés Shamir et le root token ne doivent PAS être stockés dans Ansible Vault (coffres individuels, KeePass offline, etc.).

### 5.6 Rôle `openbao`

**`defaults/main.yml`** : paramètres Raft (`performance_multiplier: 1`, `snapshot_threshold: 8192`, `trailing_logs: 10000`), listener address `0.0.0.0`, log level `info`, log format `json`, telemetry Prometheus activée, UI activée, seal type shamir, audit log activé, limites systemd.

**`vars/main.yml`** : URL de téléchargement OpenBao depuis GitHub releases, chemin du binaire `/usr/local/bin/bao`.

**`tasks/main.yml`** : importe les sous-tâches dans l'ordre preflight → packages → user → install → tls → config → systemd → firewall → logrotate → service, chacune avec ses tags.

**`tasks/preflight.yml`** : asserts sur `ansible_os_family == "RedHat"`, version major >= 9, `openbao_node_id` défini, `openbao_dc` défini, `openbao_checksum_sha256` défini et de longueur 64.

**`tasks/packages.yml`** : installer `unzip`, `firewalld`, `python3-firewall`, `policycoreutils-python-utils`, `logrotate`, `jq`. Activer firewalld.

**`tasks/user.yml`** : créer groupe et utilisateur système `openbao` (nologin, home=data_dir, sans création de home), créer les répertoires avec les bonnes permissions (config_dir 0750, tls_dir 0750, data_dir 0700, raft subdir 0700, log_dir 0750).

**`tasks/install.yml`** : vérifier la version actuelle, télécharger avec `get_url` en vérifiant le checksum SHA256, décompresser avec `unarchive`, appliquer `cap_ipc_lock=+ep` via `community.general.capabilities`, nettoyer l'archive.

**`tasks/tls.yml`** : vérifier la présence des artefacts PKI sur le contrôleur (CA + cert/clé par host dans `./pki/`), copier `ca.crt`, `<host>.crt`, `<host>.key` dans `/etc/openbao/tls/`, ajouter la CA au trust store système (`/etc/pki/ca-trust/source/anchors/`).

**`tasks/config.yml`** : déployer le template `config.hcl.j2` (avec validation `bao operator diagnose` en soft-fail), déployer `/etc/sysconfig/openbao`.

**`templates/config.hcl.j2`** : bloc `storage "raft"` avec `node_id` et `retry_join` itérant sur `groups['openbao']` (un bloc retry_join par nœud, avec leader_api_addr, leader_ca_cert_file, leader_client_cert_file, leader_client_key_file) ; bloc `listener "tcp"` avec address, cluster_address, certs TLS, `tls_min_version` et `tls_cipher_suites`, x_forwarded_for hardening ; `api_addr` et `cluster_addr` en https ; `cluster_name = "openbao-prod"` ; `ui = true` ; `log_level` et `log_format` ; `disable_mlock = false` ; bloc `telemetry` avec Prometheus. **Pas** de bloc `seal` (Shamir implicite).

**`templates/openbao.env.j2`** : `BAO_ADDR=https://127.0.0.1:8200`, `BAO_CACERT=/etc/openbao/tls/ca.crt`, `GOGC=100`.

**`tasks/systemd.yml`** : déployer le template unit.

**`templates/openbao.service.j2`** : unit complète avec tout le hardening listé en section 3.6. `ExecStart=/usr/local/bin/bao server -config=/etc/openbao/config.hcl`, `ExecReload=/bin/kill --signal HUP $MAINPID`, `Restart=on-failure`, `TimeoutStopSec=30`.

**`tasks/firewall.yml`** : ouvrir 8200/tcp en zone public ; pour chaque autre nœud OpenBao, ajouter une rich rule autorisant son IP sur 8201/tcp uniquement.

**`tasks/logrotate.yml`** : config logrotate pour `/var/log/openbao/*.log`, daily, rotate 30, compress, create 0640 openbao openbao, postrotate kill -HUP du pid.

**`tasks/service.yml`** : flush handlers, enable + start openbao, `wait_for` sur le port 8200, afficher le statut (`bao status -format=json`) en soft-fail (normal si non init).

**`handlers/main.yml`** : `reload systemd`, `restart openbao`, `update ca trust` (appelle `update-ca-trust extract`).

**`meta/main.yml`** : galaxy_info avec role_name, platforms EL 9, dependencies vides.

### 5.7 Rôle `haproxy`

**`defaults/main.yml`** : ports (frontend 8200, stats 8404), user stats admin (mot de passe dans vault), timeouts (connect 5s, client/server 2m, check 5s), codes healthcheck `200,429`, algo roundrobin.

**`tasks/main.yml`** : installer haproxy + firewalld + python3-firewall, créer répertoire logs, copier `ca.crt` depuis `./pki/` vers `/etc/haproxy/ca.crt`, activer seboolean `haproxy_connect_any`, déployer `haproxy.cfg.j2` (avec `validate: haproxy -c -f %s`), ouvrir firewalld (8200 public, 8404 restreint à `haproxy_stats_allowed_sources`), enable+start, logrotate.

**`templates/haproxy.cfg.j2`** : section `global` avec log local0, chroot, maxconn 50000, user/group haproxy, stats socket admin, `tune.ssl.default-dh-param 2048`, `spread-checks 4` ; `defaults` en mode tcp ; frontend `openbao_api` bind *:8200, default_backend ; backend `openbao_backend` en mode tcp, balance roundrobin, `option httpchk`, `http-check send meth GET uri /v1/sys/health?standbyok=true&perfstandbyok=true`, `http-check expect rstatus (200|429)`, `default-server check check-ssl verify required ca-file /etc/haproxy/ca.crt inter 5s fall 3 rise 2 on-marked-down shutdown-sessions`, une ligne `server` par nœud OpenBao avec SNI explicite ; frontend stats sur 8404 avec auth et `stats hide-version`.

**`handlers/main.yml`** : `reload haproxy` (systemd reload).

**`meta/main.yml`** : standard.

### 5.8 Rôle `keepalived`

**`defaults/main.yml`** : paramètres VRRP par défaut, script de check HAProxy.

**`tasks/main.yml`** : installer `keepalived` + `psmisc`, déployer script `/etc/keepalived/check_haproxy.sh` (exécutable), déployer `keepalived.conf.j2`, activer seboolean `keepalived_connect_any`, enable+start, firewalld autoriser VRRP (`protocol value="112"` via rich rule) depuis l'autre HAProxy du même DC.

**`templates/keepalived.conf.j2`** : bloc `vrrp_script chk_haproxy` qui exécute le check toutes les 2s (rise 2, fall 2, weight -20) ; bloc `vrrp_instance VI_openbao` avec `state {{ keepalived_role }}`, `interface {{ keepalived_interface }}`, `virtual_router_id {{ keepalived_vrrp_id }}`, `priority {{ keepalived_priority }}`, advert_int 1, authentication PASS (mot de passe dans vault), `virtual_ipaddress` contenant la VIP, `track_script chk_haproxy`. Pas de multicast cross-DC (une instance VRRP par DC, isolée).

**`templates/check_haproxy.sh.j2`** : script bash simple qui fait `pgrep haproxy` et retourne exit 0 ou 1.

**`handlers/main.yml`** : `restart keepalived`.

### 5.9 `playbooks/pki.yml`

Playbook `hosts: localhost`, `connection: local`, qui génère la PKI interne dans `./pki/` avec `community.crypto` :

1. Créer le répertoire `./pki/` (mode 0700).
2. Générer la clé privée CA (RSA 4096, chiffrée avec passphrase depuis vault).
3. Générer le CSR CA (self-signed, CN depuis `pki_common_name_ca`).
4. Générer le certificat CA (10 ans, basicConstraints CA:TRUE, keyUsage keyCertSign+cRLSign).
5. Pour chaque host dans `groups['openbao']` : générer clé (RSA 4096, non chiffrée car le service en a besoin), CSR avec SAN (DNS : inventory_hostname, inventory_hostname.domain, localhost ; IP : ansible_host, 127.0.0.1), signer avec la CA (validity 1 an), extKeyUsage serverAuth+clientAuth.

### 5.10 `playbooks/site.yml`

```yaml
---
- name: Déployer les nœuds OpenBao
  hosts: openbao
  become: true
  roles:
    - openbao

- name: Déployer HAProxy
  hosts: haproxy
  become: true
  roles:
    - haproxy

- name: Déployer keepalived
  hosts: haproxy
  become: true
  roles:
    - keepalived
```

### 5.11 `playbooks/backup.yml`

Playbook qui se connecte au leader OpenBao (à détecter dynamiquement via `bao status`) et exécute `bao operator raft snapshot save /var/backups/openbao/snapshot-<timestamp>.snap`, avec authentification par token (token dans vault, usage d'un token dédié à cette tâche avec policy minimaliste). Archiver le snapshot vers un stockage externe (S3, NFS — à paramétrer).

### 5.12 `docs/RUNBOOK.md`

Runbook d'exploitation contenant **au minimum** les sections :

1. **Initialisation du cluster** (une seule fois)
   - Sur node-1 : `bao operator init -key-shares=5 -key-threshold=3 -format=json > /tmp/init.json`
   - Récupérer les 5 unseal keys et le root token, les distribuer immédiatement entre 5 opérateurs différents (coffres individuels), puis détruire `/tmp/init.json`.
   - Unseal node-1 avec 3 des 5 clés (`bao operator unseal` x3).
   - Sur node-2 et node-3 : service démarre, fait `retry_join` automatiquement, il faut juste les unseal avec 3 clés.
   - Vérifier `bao operator raft list-peers` : les 3 nœuds sont voters.

2. **Unseal après reboot**
   - Procédure avec les 3 opérateurs, commandes, vérification.

3. **Snapshot Raft**
   - Snapshot manuel : `bao operator raft snapshot save`.
   - Automatisation via `playbooks/backup.yml` + cron/systemd timer.
   - Rétention : 30 jours locaux, 1 an sur stockage externe.

4. **Restore depuis snapshot**
   - Procédure d'urgence en cas de corruption totale.
   - `bao operator raft snapshot restore` avec token root, implications (nouveau cluster, re-unseal, re-authentification clients).

5. **Rotation des certificats TLS**
   - Régénérer via `playbooks/pki.yml` en incrémentant `validity` ou suite à compromission.
   - Rolling restart des nœuds OpenBao (1 par 1, unseal entre chaque).

6. **Ajout d'un nœud**
   - Ajouter dans l'inventaire.
   - `ansible-playbook playbooks/pki.yml` (générer son cert).
   - `ansible-playbook playbooks/site.yml --limit nouveau_host`.
   - Unseal manuel, vérifier le join.

7. **Retrait d'un nœud**
   - `bao operator raft remove-peer <node_id>` depuis le leader.
   - Stop service, cleanup, retirer de l'inventaire.

8. **Dépannage**
   - Logs : `journalctl -u openbao -f`, `/var/log/openbao/audit.log`.
   - Statut cluster : `bao status`, `bao operator raft list-peers`.
   - Santé HAProxy : stats sur `:8404/stats`.
   - Keepalived : `journalctl -u keepalived`, vérifier la VIP avec `ip addr`.

### 5.13 `docs/architecture.drawio`

Diagramme draw.io (format XML) représentant :
- 3 encarts "Datacenter A/B/C", chacun contenant : 1 VIP (losange vert pointillé), 2 HAProxy (rectangles bleus, l'un MASTER l'autre BACKUP), 1 nœud OpenBao (rectangle jaune).
- Flèches pleines clients → VIP, flèches pointillées VIP → HAProxy actif.
- Flèches pointillées HAProxy → tous les nœuds OpenBao (passthrough TLS).
- Flèches épaisses bidirectionnelles entre les 3 nœuds OpenBao (réplication Raft mTLS sur 8201).
- Légende : couleurs, types de flux.

